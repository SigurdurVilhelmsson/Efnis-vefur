<!doctype html>

  <div style="display:flex;align-items:center;gap:14px"><div style="width:90px;font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">space-sm · 12</div><div style="height:18px;width:12px;background:#1a6b5a"></div></div>
